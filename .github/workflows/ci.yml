# Checks on every push and pull request:
#  - Python: lint (ruff) and the tests
#  - Web app: the built files in web/dist match the source. Vercel serves web/dist as committed (it doesn't run
#    the Vite build), so a source change pushed without rebuilding would never reach the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-full.txt
      - run: pip install -r requirements-full.txt ruff
      - run: ruff check --select F,E9,B,UP,SIM,PERF --target-version py311 api src scripts tests streamlit_app.py index.py
      - run: python -m pytest -q tests

  web-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: web/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::web/dist doesn't match web/src. Run 'npm run build' in web/ and commit web/dist."
            exit 1
          fi
